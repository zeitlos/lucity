# Namespace, prod kubeconfig (API address and CA, no user credentials) and the
# kubernetes-mcp.lucity.dev listener on the shared gateway for the Kubernetes MCP server.
apiVersion: v1
kind: Namespace
metadata:
  name: kubernetes-mcp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-mcp-kubeconfig
  namespace: kubernetes-mcp
data:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: lucity-prod
        cluster:
          server: https://46.225.44.172:443
          certificate-authority-data: 
    contexts:
      - name: lucity-prod
        context:
          cluster: lucity-prod
          user: passthrough
    users:
      - name: passthrough
        user: {}
    current-context: lucity-prod
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kubernetes-mcp-tls
  namespace: kubernetes-mcp
spec:
  secretName: kubernetes-mcp-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-dns01
  dnsNames:
    - kubernetes-mcp.lucity.dev
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: kubernetes-mcp
  namespace: kubernetes-mcp
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: lucity-gateway
    namespace: lucity-system
  listeners:
    - name: https
      hostname: kubernetes-mcp.lucity.dev
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - name: kubernetes-mcp-tls
