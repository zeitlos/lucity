registryPull:
  host: "10.96.100.100:5000"
  username: reader

routes:
  enabled: true
  hostname: lucity.dev
  sectionName: platform-https
  # Keep the development instance out of search indexes. It serves the same
  # docs and dashboard as production, so it must never be indexed.
  responseHeaders:
    X-Robots-Tag: "noindex, nofollow"

banner:
  message: "This is the Lucity development environment, not production. For real projects, use lucity.cloud."
  severity: warn
  dismissible: false

conductor:
  registryHost: lucity-infra-zot.lucity-system.svc.cluster.local:5000
  registryUsername: builder
  buildkit:
    enabled: true
    storageSize: 50Gi
  env:
    OIDC_ISSUER_URL: https://id.lucity.dev/oidc
    OIDC_CLIENT_ID: tra6m86tjgolnq6ubifd0
    OIDC_AUDIENCE: https://api.lucity.dev
    OIDC_CLI_CLIENT_ID: ifzsbmxdp02kaycalc81r
    OIDC_CALLBACK_URL: https://lucity.dev/auth/callback
    DASHBOARD_URL: https://lucity.dev/app

    GITHUB_APP_ID: "5043321"
    GITHUB_PRIVATE_KEY_PATH: /secrets/github/github-app.pem
    GITHUB_APP_SLUG: lucity-platform-dev
    GITHUB_CLIENT_ID: Iv23liXHnIbHQPI3iBzT

    LOGTO_ENDPOINT: http://lucity-infra-logto.lucity-system.svc.cluster.local:3001


    STRIPE_HOBBY_PRICE_ID: &hobby-price price_1USdK4Aczm59y8RPx4EL5iAb
    STRIPE_PRO_PRICE_ID: &pro-price price_1USdK3Aczm59y8RPoIYz1agP
    STRIPE_ECO_CPU_PRICE_ID: price_1USdNKAczm59y8RPBPjvI7pN
    STRIPE_ECO_MEM_PRICE_ID: price_1USdNLAczm59y8RPG4kbNhu5
    STRIPE_ECO_DISK_PRICE_ID: price_1USdNLAczm59y8RPgnBW0BEG
    STRIPE_PROD_CPU_PRICE_ID: price_1USdNMAczm59y8RPiJHefikh
    STRIPE_PROD_MEM_PRICE_ID: price_1USdNNAczm59y8RPdeDMpXtS
    STRIPE_PROD_DISK_PRICE_ID: price_1USdNOAczm59y8RPvke3Og3S
    STRIPE_STORAGE_PRICE_ID: price_1USdNPAczm59y8RPMUYnmHfj
    STRIPE_EGRESS_PRICE_ID: price_1USdNPAczm59y8RPyFgdLdK9

    REGISTRY_URL: lucity-infra-zot.lucity-system.svc.cluster.local:5000
    REGISTRY_PUSH_URL: lucity-infra-zot.lucity-system.svc.cluster.local:5000
    REGISTRY_PULL_URL: 10.96.100.100:5000
    REGISTRY_AUTH_SECRET: lucity-registry-auth

    WORKLOAD_DOMAIN: lucity.io
    DATABASE_DOMAIN: db.lucity.io
    IP_ADDRESS: "46.225.44.63"
    GATEWAY_HTTPS_LISTENER: workload-https

    VICTORIA_METRICS_URL: http://lucity-infra-victoria-metrics-single-server.lucity-system.svc.cluster.local:8428

    OVH_PROJECT_ID: "2eb456d1d19d4e30982a0d261743e2f3"
    OVH_ENDPOINT: ovh-eu
    OVH_REGION: GRA

    PUBLIC_BUCKET_DOMAIN: storage.lucity.io

    EDGE_ORIGIN_URL: "https://46.225.44.63"
    EDGE_WILDCARD_TLS_SECRET: lucity-io-wildcard-tls
    EDGE_HEADER_ENFORCED: "true"

    DATABASE_BACKUP_ENABLED: "false"
  envSecret:
    STRIPE_SECRET_KEY: CONDUCTOR_STRIPE_SECRET_KEY
    SESSION_SECRET: SESSION_SECRET
    GITHUB_CLIENT_SECRET: GITHUB_CLIENT_SECRET
    LOGTO_M2M_APP_ID: LOGTO_M2M_APP_ID
    LOGTO_M2M_APP_SECRET: LOGTO_M2M_APP_SECRET
    WEBHOOK_SECRET: GITHUB_WEBHOOK_SECRET
    OVH_APPLICATION_KEY: OVH_APPLICATION_KEY
    OVH_APPLICATION_SECRET: OVH_APPLICATION_SECRET
    OVH_CONSUMER_KEY: OVH_CONSUMER_KEY
    BUNNY_API_KEY: BUNNY_API_KEY
    EDGE_HEADER_SECRET: EDGE_HEADER_SECRET

cashier:
  enabled: true
  env:
    LOGTO_ENDPOINT: http://lucity-infra-logto.lucity-system.svc.cluster.local:3001
    STRIPE_HOBBY_PRICE_ID: *hobby-price
    STRIPE_PRO_PRICE_ID: *pro-price
    STRIPE_ECO_CPU_METER_EVENT: eco_cpu_usage
    STRIPE_ECO_MEM_METER_EVENT: eco_memory_usage
    STRIPE_ECO_DISK_METER_EVENT: eco_disk_usage
    STRIPE_STORAGE_METER_EVENT: object_storage_usage
    STRIPE_EGRESS_METER_EVENT: egress_usage
    METERING_INTERVAL: 5m
    VICTORIA_METRICS_URL: http://lucity-infra-victoria-metrics-single-server.lucity-system.svc.cluster.local:8428
  envSecret:
    STRIPE_SECRET_KEY: STRIPE_SECRET_KEY
    LOGTO_M2M_APP_ID: LOGTO_M2M_APP_ID
    LOGTO_M2M_APP_SECRET: LOGTO_M2M_APP_SECRET

stagehand:
  enabled: true
  env:
    STRIPE_HOBBY_PRICE_ID: *hobby-price
    STRIPE_PRO_PRICE_ID: *pro-price
  envSecret:
    STRIPE_SECRET_KEY: STAGEHAND_STRIPE_SECRET_KEY

exporter:
  enabled: true
  env:
    OVH_ENDPOINT: ovh-eu
    OVH_PROJECT_ID: "2eb456d1d19d4e30982a0d261743e2f3"
    OVH_REGION: GRA
  envSecret:
    OVH_APPLICATION_KEY: EXPORTER_OVH_APPLICATION_KEY
    OVH_APPLICATION_SECRET: EXPORTER_OVH_APPLICATION_SECRET
    OVH_CONSUMER_KEY: EXPORTER_OVH_CONSUMER_KEY
