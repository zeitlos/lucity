registryPull:
  host: "10.96.100.100:5000"
  username: reader

routes:
  enabled: true
  sectionName: platform-https

conductor:
  registryHost: lucity-infra-zot.lucity-system.svc.cluster.local:5000
  registryUsername: builder
  nodeSelector: &platform-nodes
    lucity.dev/node-pool: platform
  tolerations: &platform-taint
    - key: lucity.dev/node-pool
      operator: Equal
      value: platform
      effect: NoSchedule
  buildkit:
    enabled: true
    storageSize: 100Gi
    resources:
      requests:
        memory: 6Gi
      limits:
        memory: 8Gi
    nodeSelector:
      lucity.dev/node-pool: builds
    tolerations:
      - key: lucity.dev/node-pool
        operator: Equal
        value: builds
        effect: NoSchedule
  env:
    OIDC_ISSUER_URL: https://id.lucity.cloud/oidc
    OIDC_CLIENT_ID: 30ztkgeb1c7hwmnx6bf4s
    OIDC_AUDIENCE: https://api.lucity.cloud
    OIDC_CLI_CLIENT_ID: y4jzqbb1vm92i7v05djd7
    OIDC_CALLBACK_URL: https://lucity.cloud/auth/callback
    DASHBOARD_URL: https://lucity.cloud/app

    GITHUB_APP_ID: "2882801"
    GITHUB_PRIVATE_KEY_PATH: /secrets/github/github-app.pem
    GITHUB_APP_SLUG: lucity-platform
    GITHUB_CLIENT_ID: Iv23liMzm79VIgvNtglX

    LOGTO_ENDPOINT: http://lucity-infra-logto.lucity-system.svc.cluster.local:3001


    STRIPE_HOBBY_PRICE_ID: &hobby-price price_1TASy6AoheV3Drw6W13KVFYm
    STRIPE_PRO_PRICE_ID: &pro-price price_1TASy7AoheV3Drw6t22UVU8C
    STRIPE_ECO_CPU_PRICE_ID: price_1TASyOAoheV3Drw6CUwBuS1L
    STRIPE_ECO_MEM_PRICE_ID: price_1TASyPAoheV3Drw6MLH0Qh0C
    STRIPE_ECO_DISK_PRICE_ID: price_1TFERsAoheV3Drw6VJeNcGdv
    STRIPE_PROD_CPU_PRICE_ID: price_1TF9qaAoheV3Drw6En35zCEK
    STRIPE_PROD_MEM_PRICE_ID: price_1TF9qmAoheV3Drw6zasPNVfM
    STRIPE_PROD_DISK_PRICE_ID: price_1TFERtAoheV3Drw6953EpJgr
    STRIPE_STORAGE_PRICE_ID: price_1USesrAoheV3Drw6lnfGRnIl
    STRIPE_EGRESS_PRICE_ID: price_1USestAoheV3Drw6qvofsUSz

    REGISTRY_URL: lucity-infra-zot.lucity-system.svc.cluster.local:5000
    REGISTRY_PUSH_URL: lucity-infra-zot.lucity-system.svc.cluster.local:5000
    REGISTRY_PULL_URL: 10.96.100.100:5000
    REGISTRY_AUTH_SECRET: lucity-registry-auth

    WORKLOAD_DOMAIN: lucity.app
    DATABASE_DOMAIN: db.lucity.app
    IP_ADDRESS: "46.225.47.40"
    GATEWAY_HTTPS_LISTENER: workload-https

    VICTORIA_METRICS_URL: http://lucity-infra-victoria-metrics-single-server.lucity-system.svc.cluster.local:8428

    OVH_PROJECT_ID: "df349a670c8a4d3fbe69a87d4c2f25a9"
    OVH_ENDPOINT: ovh-eu
    OVH_REGION: GRA

    PUBLIC_BUCKET_DOMAIN: storage.lucity.app

    EDGE_ORIGIN_URL: "https://46.225.47.40"
    EDGE_HEADER_ENFORCED: "false"

    DATABASE_BACKUP_ENABLED: "true"
    DATABASE_BACKUP_S3_ENDPOINT: https://s3.eu-west-par.io.cloud.ovh.net
    DATABASE_BACKUP_S3_BUCKET: lucity-prod-db-backups
    DATABASE_BACKUP_S3_REGION: eu-west-par
  envSecret:
    STRIPE_SECRET_KEY: CONDUCTOR_STRIPE_SECRET_KEY
    SESSION_SECRET: SESSION_SECRET
    GITHUB_CLIENT_SECRET: GITHUB_CLIENT_SECRET
    LOGTO_M2M_APP_ID: LOGTO_M2M_APP_ID
    LOGTO_M2M_APP_SECRET: LOGTO_M2M_APP_SECRET
    WEBHOOK_SECRET: GITHUB_WEBHOOK_SECRET
    OVH_APPLICATION_KEY: OVH_APPLICATION_KEY
    OVH_APPLICATION_SECRET: OVH_APPLICATION_SECRET
    OVH_CONSUMER_KEY: OVH_CONSUMER_KEY
    BUNNY_API_KEY: BUNNY_API_KEY
    EDGE_HEADER_SECRET: EDGE_HEADER_SECRET
    DATABASE_BACKUP_S3_ACCESS_KEY_ID: DATABASE_BACKUP_S3_ACCESS_KEY_ID
    DATABASE_BACKUP_S3_SECRET_ACCESS_KEY: DATABASE_BACKUP_S3_SECRET_ACCESS_KEY

cashier:
  enabled: true
  nodeSelector: *platform-nodes
  tolerations: *platform-taint
  env:
    LOGTO_ENDPOINT: http://lucity-infra-logto.lucity-system.svc.cluster.local:3001
    STRIPE_HOBBY_PRICE_ID: *hobby-price
    STRIPE_PRO_PRICE_ID: *pro-price
    STRIPE_ECO_CPU_METER_EVENT: eco_cpu_usage
    STRIPE_ECO_MEM_METER_EVENT: eco_memory_usage
    STRIPE_ECO_DISK_METER_EVENT: eco_disk_usage
    STRIPE_STORAGE_METER_EVENT: object_storage_usage
    STRIPE_EGRESS_METER_EVENT: egress_usage
    VICTORIA_METRICS_URL: http://lucity-infra-victoria-metrics-single-server.lucity-system.svc.cluster.local:8428
  envSecret:
    STRIPE_SECRET_KEY: CASHIER_STRIPE_SECRET_KEY
    LOGTO_M2M_APP_ID: LOGTO_M2M_APP_ID
    LOGTO_M2M_APP_SECRET: LOGTO_M2M_APP_SECRET

exporter:
  enabled: true
  nodeSelector: *platform-nodes
  tolerations: *platform-taint
  env:
    OVH_ENDPOINT: ovh-eu
    OVH_PROJECT_ID: "df349a670c8a4d3fbe69a87d4c2f25a9"
    OVH_REGION: GRA
  envSecret:
    OVH_APPLICATION_KEY: EXPORTER_OVH_APPLICATION_KEY
    OVH_APPLICATION_SECRET: EXPORTER_OVH_APPLICATION_SECRET
    OVH_CONSUMER_KEY: EXPORTER_OVH_CONSUMER_KEY

workloadPlacement:
  default:
    nodeSelector:
      lucity.dev/node-pool: free
    tolerations:
      - key: lucity.dev/node-pool
        operator: Equal
        value: free
        effect: NoSchedule
  paid:
    nodeSelector:
      lucity.dev/node-pool: paid
    tolerations:
      - key: lucity.dev/node-pool
        operator: Equal
        value: paid
        effect: NoSchedule

stagehand:
  enabled: true
  dryRun: false
  resources:
    requests:
      cpu: 750m
  nodeSelector: *platform-nodes
  tolerations: *platform-taint
  env:
    STRIPE_HOBBY_PRICE_ID: *hobby-price
    STRIPE_PRO_PRICE_ID: *pro-price
  envSecret:
    STRIPE_SECRET_KEY: STAGEHAND_STRIPE_SECRET_KEY

dashboard:
  nodeSelector: *platform-nodes
  tolerations: *platform-taint

docs:
  nodeSelector: *platform-nodes
  tolerations: *platform-taint
