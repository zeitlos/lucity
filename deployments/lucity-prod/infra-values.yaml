zot:
  persistence: true
  pvc:
    create: true
    storage: 20Gi
    storageClassName: hcloud-volumes
  service:
    clusterIP: "10.96.100.100"
  mountConfig: true
  configFiles:
    config.json: |-
      {
        "storage": {
          "rootDirectory": "/var/lib/registry",
          "gc": true,
          "gcDelay": "1h",
          "gcInterval": "24h",
          "retention": {
            "dryRun": true,
            "delay": "168h",
            "policies": [
              {
                "repositories": ["**"],
                "deleteUntagged": true,
                "deleteReferrers": false,
                "keepTags": [
                  { "patterns": ["^buildcache$"] },
                  { "patterns": [".*"], "mostRecentlyPushedCount": 10 },
                  { "patterns": [".*"], "mostRecentlyPulledCount": 5 },
                  { "patterns": [".*"], "pushedWithin": "72h" }
                ]
              }
            ]
          }
        },
        "http": {
          "address": "0.0.0.0",
          "port": "5000",
          "compat": ["docker2s2"],
          "auth": {
            "htpasswd": {
              "path": "/etc/zot/htpasswd"
            }
          },
          "accessControl": {
            "repositories": {
              "**": {
                "defaultPolicy": ["read"],
                "policies": [
                  {
                    "users": ["builder"],
                    "actions": ["read", "create", "update", "delete"]
                  }
                ]
              }
            }
          }
        },
        "log": {
          "level": "info"
        },
        "extensions": {
          "search": {
            "enable": true,
            "cve": {
              "updateInterval": "2h"
            }
          },
          "ui": {
            "enable": true
          }
        }
      }
    # htpasswd: two users — builder (read-write, used by BuildKit to push) and
    # reader (read-only, used by kubelet imagePullSecrets). No anonymous access.
    # Generate: htpasswd -bBn builder "$(openssl rand -hex 16)" > htpasswd
    #           htpasswd -bBn reader "$(openssl rand -hex 16)" >> htpasswd
    htpasswd: ""  # --set zot.configFiles.htpasswd

gateway:
  className: cilium
  customDomainPlaceholder: true
  infrastructure:
    annotations:
      flexplane.io/provider: hetzner
      load-balancer.hetzner.cloud/location: nbg1
      load-balancer.hetzner.cloud/name: flexplane-lucity-prod-gateway
      load-balancer.hetzner.cloud/uses-proxyprotocol: "true"
  listeners:
    - name: platform-http
      protocol: HTTP
      port: 80
      hostname: lucity.cloud
    - name: platform-https
      protocol: HTTPS
      port: 443
      hostname: lucity.cloud
      tls:
        mode: Terminate
        certificateRefs:
          - name: lucity-cloud-tls
    - name: workload-http
      protocol: HTTP
      port: 80
      hostname: "*.lucity.app"
    - name: workload-https
      protocol: HTTPS
      port: 443
      hostname: "*.lucity.app"
      tls:
        mode: Terminate
        certificateRefs:
          - name: lucity-app-wildcard-tls
    - name: analytics-http
      protocol: HTTP
      port: 80
      hostname: p.lucity.cloud
    - name: analytics-https
      protocol: HTTPS
      port: 443
      hostname: p.lucity.cloud
      tls:
        mode: Terminate
        certificateRefs:
          - name: p-lucity-cloud-tls
    - name: auth-http
      protocol: HTTP
      port: 80
      hostname: auth.lucity.cloud
    - name: auth-https
      protocol: HTTPS
      port: 443
      hostname: auth.lucity.cloud
      tls:
        mode: Terminate
        certificateRefs:
          - name: auth-lucity-cloud-tls
    - name: id-http
      protocol: HTTP
      port: 80
      hostname: id.lucity.cloud
    - name: id-https
      protocol: HTTPS
      port: 443
      hostname: id.lucity.cloud
      tls:
        mode: Terminate
        certificateRefs:
          - name: id-lucity-cloud-tls
    # Custom domain listeners are managed by the deployer (per-domain HTTP + HTTPS pairs).
    # No catch-all listeners here — each domain gets its own isolated listener.

traefik:
  enabled: true
  service:
    annotations:
      flexplane.io/provider: hetzner
      load-balancer.hetzner.cloud/location: nbg1
      load-balancer.hetzner.cloud/name: flexplane-lucity-prod-postgres
      external-dns.alpha.kubernetes.io/hostname: "*.db.lucity.app"

clusterIssuers:
  - name: letsencrypt-http01
    acme:
      server: https://acme-v02.api.letsencrypt.org/directory
      email: certificates@zeitlos.software
      solvers:
        - http01:
            gatewayHTTPRoute:
              parentRefs:
                - name: lucity-gateway
                  namespace: lucity-system
                  kind: Gateway

certificates:
  - name: lucity-cloud-tls
    secretName: lucity-cloud-tls
    issuerRef:
      name: letsencrypt-dns01
    dnsNames:
      - lucity.cloud
  - name: lucity-app-wildcard-tls
    secretName: lucity-app-wildcard-tls
    issuerRef:
      name: letsencrypt-dns01
    dnsNames:
      - "*.lucity.app"
  - name: p-lucity-cloud-tls
    secretName: p-lucity-cloud-tls
    issuerRef:
      name: letsencrypt-dns01
    dnsNames:
      - p.lucity.cloud
  - name: auth-lucity-cloud-tls
    secretName: auth-lucity-cloud-tls
    issuerRef:
      name: letsencrypt-dns01
    dnsNames:
      - auth.lucity.cloud
  - name: id-lucity-cloud-tls
    secretName: id-lucity-cloud-tls
    issuerRef:
      name: letsencrypt-dns01
    dnsNames:
      - id.lucity.cloud

backups:
  enabled: true
  endpoint: https://s3.eu-west-par.io.cloud.ovh.net
  bucket: lucity-prod-platform-backups

# Rybbit Web Analytics
rybbit:
  enabled: true
  hostname: p.lucity.cloud
  backend:
    baseUrl: "https://p.lucity.cloud"
  clickhouse:
    persistence:
      storageClass: hcloud-volumes
      size: 10Gi
  postgres:
    storageClass: hcloud-volumes
  redis:
    storageClass: hcloud-volumes
    size: 10Gi              # Hetzner Cloud Volumes have a 10Gi minimum
  secrets:
    clickhousePassword: ""   # --set rybbit.secrets.clickhousePassword
    betterAuthSecret: ""     # --set rybbit.secrets.betterAuthSecret
    redisPassword: ""        # --set rybbit.secrets.redisPassword

# Logto Identity Provider
logto:
  enabled: true
  endpoint: https://id.lucity.cloud
  postgres:
    instances: 2
    storageClass: hcloud-volumes

# Observability stack
victoria-metrics-single:
  enabled: true
  server:
    persistentVolume:
      size: 50Gi
      storageClassName: hcloud-volumes
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi

victoria-logs-single:
  enabled: true
  server:
    persistentVolume:
      size: 50Gi
      storageClassName: hcloud-volumes
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi

victoria-metrics-alert:
  enabled: true
  alertmanager:
    enabled: true
    persistentVolume:
      enabled: true
      size: 10Gi          # Hetzner Cloud Volumes have a 10Gi minimum
      storageClassName: hcloud-volumes
    # The full receivers[] list (with the real Telegram chat_id) is set in
    # infra-secrets.yaml so the bot_token + chat_id live together.

opentelemetry-operator:
  enabled: false

otelCollector:
  daemonset:
    enabled: true
  deployment:
    enabled: true

grafana:
  enabled: true
  deploymentStrategy:
    type: Recreate
  persistence:
    storageClassName: hcloud-volumes
  grafana.ini:
    server:
      root_url: "http://localhost:3000/"   # port-forward only for now
    auth.generic_oauth:
      client_id: "xwnuy3a1sl2yl1uu6hyx3"
      auth_url: "https://id.lucity.cloud/oidc/auth"
      token_url: "https://id.lucity.cloud/oidc/token"
      api_url: "https://id.lucity.cloud/oidc/me"
