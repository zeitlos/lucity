zot:
  persistence: true
  pvc:
    create: true
    storage: 20Gi
    storageClassName: hcloud-volumes
  service:
    clusterIP: "10.96.100.100"
  mountConfig: true
  configFiles:
    config.json: |-
      {
        "storage": {
          "rootDirectory": "/var/lib/registry",
          "gc": true,
          "gcDelay": "1h",
          "gcInterval": "24h",
          "retention": {
            "dryRun": false,
            "delay": "24h",
            "policies": [
              {
                "repositories": ["**"],
                "deleteUntagged": true,
                "deleteReferrers": false,
                "keepTags": [
                  { "patterns": ["^buildcache$", "^secrets-latest$"] },
                  { "patterns": [".*"], "mostRecentlyPushedCount": 10, "mostRecentlyPulledCount": 5 }
                ]
              }
            ]
          }
        },
        "http": {
          "address": "0.0.0.0",
          "port": "5000",
          "compat": ["docker2s2"],
          "auth": {
            "htpasswd": {
              "path": "/etc/zot/htpasswd"
            }
          },
          "accessControl": {
            "repositories": {
              "**": {
                "defaultPolicy": ["read"],
                "policies": [
                  {
                    "users": ["builder"],
                    "actions": ["read", "create", "update", "delete"]
                  }
                ]
              }
            }
          }
        },
        "log": {
          "level": "info"
        },
        "extensions": {
          "search": {
            "enable": true,
            "cve": {
              "updateInterval": "2h"
            }
          },
          "ui": {
            "enable": true
          }
        }
      }
    # htpasswd: two users — builder (read-write, used by BuildKit to push) and
    # reader (read-only, used by kubelet imagePullSecrets). No anonymous access.
    # Generate: htpasswd -bBn builder "$(openssl rand -hex 16)" > htpasswd
    #           htpasswd -bBn reader "$(openssl rand -hex 16)" >> htpasswd
    htpasswd: ""  # --set zot.configFiles.htpasswd
  resources:
    requests:
      cpu: 100m
      memory: 4Gi
    limits:
      memory: 8Gi
  nodeSelector: &platform-nodes
    lucity.dev/node-pool: platform
  tolerations: &platform-taint
    - key: lucity.dev/node-pool
      operator: Equal
      value: platform
      effect: NoSchedule

gateway:
  className: cilium
  infrastructure:
    annotations:
      flexplane.io/provider: hetzner
      load-balancer.hetzner.cloud/location: nbg1
      load-balancer.hetzner.cloud/name: flexplane-lucity-prod-gateway
      load-balancer.hetzner.cloud/uses-proxyprotocol: "true"
      load-balancer.hetzner.cloud/ipv6-disabled: "true"
      load-balancer.hetzner.cloud/node-selector: lucity.dev/node-pool=platform
  listeners:
    - name: platform-http
      protocol: HTTP
      port: 80
      hostname: lucity.cloud
      httpsRedirect: true
    - name: platform-https
      protocol: HTTPS
      port: 443
      hostname: lucity.cloud
      tls:
        mode: Terminate
        certificateRefs:
          - name: lucity-cloud-tls
    - name: workload-http
      protocol: HTTP
      port: 80
      hostname: "*.lucity.app"
      httpsRedirect: true
    - name: workload-https
      protocol: HTTPS
      port: 443
      hostname: "*.lucity.app"
      tls:
        mode: Terminate
        certificateRefs:
          - name: lucity-app-wildcard-tls
    - name: analytics-http
      protocol: HTTP
      port: 80
      hostname: p.lucity.cloud
      httpsRedirect: true
    - name: analytics-https
      protocol: HTTPS
      port: 443
      hostname: p.lucity.cloud
      tls:
        mode: Terminate
        certificateRefs:
          - name: p-lucity-cloud-tls
    - name: auth-http
      protocol: HTTP
      port: 80
      hostname: auth.lucity.cloud
    - name: auth-https
      protocol: HTTPS
      port: 443
      hostname: auth.lucity.cloud
      tls:
        mode: Terminate
        certificateRefs:
          - name: auth-lucity-cloud-tls
    - name: id-http
      protocol: HTTP
      port: 80
      hostname: id.lucity.cloud
      httpsRedirect: true
    - name: id-https
      protocol: HTTPS
      port: 443
      hostname: id.lucity.cloud
      tls:
        mode: Terminate
        certificateRefs:
          - name: id-lucity-cloud-tls

traefik:
  enabled: true
  nodeSelector: *platform-nodes
  tolerations: *platform-taint
  ports:
    postgres:
      proxyProtocol:
        trustedIPs: ["10.0.0.0/24"]
  service:
    spec:
      externalTrafficPolicy: Local
    annotations:
      flexplane.io/provider: hetzner
      load-balancer.hetzner.cloud/location: nbg1
      load-balancer.hetzner.cloud/name: flexplane-lucity-prod-postgres
      load-balancer.hetzner.cloud/uses-proxyprotocol: "true"
      load-balancer.hetzner.cloud/use-private-ip: "true"
      load-balancer.hetzner.cloud/ipv6-disabled: "true"
      load-balancer.hetzner.cloud/node-selector: lucity.dev/node-pool=platform
      external-dns.kubernetes.io/hostname: "*.db.lucity.app"

clusterIssuers:
  - name: letsencrypt-http01
    acme:
      server: https://acme-v02.api.letsencrypt.org/directory
      email: certificates@zeitlos.software
      solvers:
        - http01:
            gatewayHTTPRoute:
              podTemplate:
                spec:
                  affinity:
                    nodeAffinity:
                      requiredDuringSchedulingIgnoredDuringExecution:
                        nodeSelectorTerms:
                          - matchExpressions:
                              - key: lucity.dev/node-pool
                                operator: In
                                values: [free, paid]
                  tolerations:
                    - key: lucity.dev/node-pool
                      operator: Equal
                      value: free
                      effect: NoSchedule
                    - key: lucity.dev/node-pool
                      operator: Equal
                      value: paid
                      effect: NoSchedule

certificates:
  - name: lucity-cloud-tls
    secretName: lucity-cloud-tls
    issuerRef:
      name: letsencrypt-dns01
    dnsNames:
      - lucity.cloud
  - name: lucity-app-wildcard-tls
    secretName: lucity-app-wildcard-tls
    issuerRef:
      name: letsencrypt-dns01
    dnsNames:
      - "*.lucity.app"
  - name: p-lucity-cloud-tls
    secretName: p-lucity-cloud-tls
    issuerRef:
      name: letsencrypt-dns01
    dnsNames:
      - p.lucity.cloud
  - name: auth-lucity-cloud-tls
    secretName: auth-lucity-cloud-tls
    issuerRef:
      name: letsencrypt-dns01
    dnsNames:
      - auth.lucity.cloud
  - name: id-lucity-cloud-tls
    secretName: id-lucity-cloud-tls
    issuerRef:
      name: letsencrypt-dns01
    dnsNames:
      - id.lucity.cloud

backups:
  enabled: true
  endpoint: https://s3.eu-west-par.io.cloud.ovh.net
  bucket: lucity-prod-platform-backups

# Rybbit Web Analytics
rybbit:
  enabled: true
  hostname: p.lucity.cloud
  route:
    annotations:
      external-dns.kubernetes.io/hostname: p.lucity.cloud
    sectionName: analytics-https
  backend:
    baseUrl: "https://p.lucity.cloud"
    nodeSelector: *platform-nodes
    tolerations: *platform-taint
  client:
    nodeSelector: *platform-nodes
    tolerations: *platform-taint
  clickhouse:
    persistence:
      storageClass: hcloud-volumes
      size: 10Gi
    resources:
      requests:
        memory: 1Gi
      limits:
        memory: 2Gi
    nodeSelector: *platform-nodes
    tolerations: *platform-taint
  postgres:
    storageClass: hcloud-volumes
    nodeSelector: *platform-nodes
    tolerations: *platform-taint
  redis:
    storageClass: hcloud-volumes
    size: 10Gi              # Hetzner Cloud Volumes have a 10Gi minimum
    nodeSelector: *platform-nodes
    tolerations: *platform-taint
  secrets:
    clickhousePassword: ""   # --set rybbit.secrets.clickhousePassword
    betterAuthSecret: ""     # --set rybbit.secrets.betterAuthSecret
    redisPassword: ""        # --set rybbit.secrets.redisPassword

# Logto Identity Provider
logto:
  enabled: true
  endpoint: https://id.lucity.cloud
  route:
    annotations:
      external-dns.kubernetes.io/hostname: id.lucity.cloud
    sectionName: id-https
  nodeSelector: *platform-nodes
  tolerations: *platform-taint
  postgres:
    instances: 2
    storageClass: hcloud-volumes
    nodeSelector: *platform-nodes
    tolerations: *platform-taint

# Observability stack
victoria-metrics-single:
  enabled: true
  server:
    persistentVolume:
      size: 50Gi
      storageClassName: hcloud-volumes
    resources:
      requests:
        cpu: 200m
        memory: 3Gi
      limits:
        memory: 8Gi
    nodeSelector: *platform-nodes
    tolerations: *platform-taint

victoria-logs-single:
  enabled: true
  server:
    persistentVolume:
      size: 50Gi
      storageClassName: hcloud-volumes
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi
    nodeSelector: *platform-nodes
    tolerations: *platform-taint

victoria-metrics-alert:
  enabled: true
  server:
    nodeSelector: *platform-nodes
    tolerations: *platform-taint
  alertmanager:
    enabled: true
    nodeSelector: *platform-nodes
    tolerations: *platform-taint
    persistentVolume:
      enabled: true
      size: 10Gi          # Hetzner Cloud Volumes have a 10Gi minimum
      storageClassName: hcloud-volumes
    # The full receivers[] list (with the real Telegram chat_id) is set in
    # infra-secrets.yaml so the bot_token + chat_id live together.

otelCollector:
  daemonset:
    enabled: true
    resources:
      limits:
        memory: 4Gi
  deployment:
    enabled: true
    nodeSelector: *platform-nodes
    tolerations: *platform-taint

# Hetzner Cloud exporter (LB connection ceiling + node egress); token lives in infra-secrets.yaml
hcloud-exporter:
  enabled: true
  nodeSelector: *platform-nodes
  tolerations: *platform-taint

cloudnative-pg:
  resources:
    limits:
      memory: 2Gi
  nodeSelector: *platform-nodes
  tolerations: *platform-taint

plugin-barman-cloud:
  nodeSelector: *platform-nodes
  tolerations: *platform-taint

vertical-pod-autoscaler:
  admissionController:
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 1Gi
    nodeSelector: *platform-nodes
    tolerations: *platform-taint
  recommender:
    resources:
      requests:
        memory: 512Mi
      limits:
        memory: 2Gi
    nodeSelector: *platform-nodes
    tolerations: *platform-taint
  updater:
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 1Gi
    nodeSelector: *platform-nodes
    tolerations: *platform-taint

grafana:
  enabled: true
  nodeSelector: *platform-nodes
  tolerations: *platform-taint
  deploymentStrategy:
    type: Recreate
  persistence:
    storageClassName: hcloud-volumes
  grafana.ini:
    server:
      root_url: "http://localhost:3000/"   # port-forward only for now
    auth.generic_oauth:
      client_id: "xwnuy3a1sl2yl1uu6hyx3"
      auth_url: "https://id.lucity.cloud/oidc/auth"
      token_url: "https://id.lucity.cloud/oidc/token"
      api_url: "https://id.lucity.cloud/oidc/me"
