version: 2

project_name: lucity

builds:
  - id: lucity
    dir: ./cli
    main: ./cmd/lucity
    binary: lucity
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: lucity
    ids:
      - lucity
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  mode: keep-existing
  prerelease: auto

homebrew_casks:
  - name: lucity
    ids:
      - lucity
    repository:
      owner: zeitlos
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://lucity.cloud"
    description: "Deploy software on Lucity from the command line"
    skip_upload: auto
    commit_author:
      name: lucity-release
      email: noreply@lucity.cloud
    url:
      verified: "github.com/zeitlos/lucity/"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/lucity"]
          end
