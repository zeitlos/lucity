# Lucity application chart
#
# services:
#   api:
#     image:
#       repository: registry.example.com/myapp/api
#       tag: latest
#       pullPolicy: IfNotPresent
#     port: 3000
#     replicas: 1
#     command: "npm run migrate && node server.js"   # optional; runs via /bin/sh -c
#     env:                                    # literal environment variables
#       LOG_LEVEL: info
#     databaseRefs:                           # env var <- CNPG cluster secret key
#       DATABASE_URL:
#         database: main
#         key: uri
#     sharedRefs: [SENTRY_DSN]                # keys sourced from sharedVariables
#     domains:
#       - host: api.example.com
#         verified: true                      # only verified hosts get an HTTPRoute
#     resources:                              # optional — overrides namespace LimitRange
#       requests: { cpu: 100m, memory: 128Mi }
#       limits:   { cpu: 500m, memory: 256Mi }
#     autoscaling:                            # optional — HPA
#       enabled: true
#       minReplicas: 1
#       maxReplicas: 10
#       targetCPU: 70
#     labels: {}
#     annotations: {}
#     podLabels: {}
#     podAnnotations: {}
#
# config:                                     # plain ConfigMaps
#   app-config:
#     APP_ENV: production
#
# sharedVariables:                            # env shared across services (a ConfigMap)
#   SENTRY_DSN: https://...
#
# databases:
#   postgres:
#     main:
#       instances: 1
#       size: 10Gi
#       version: "16"
#       labels: {}
#       annotations: {}
#   valkey:                                    # Redis-compatible key-value store
#     cache:
#       size: 1Gi
#       version: "8"
#       password: <generated by the control plane>
#       resources: {}
#       labels: {}
#       annotations: {}

nameOverride: ""
fullnameOverride: ""

# Scale every workload to zero, hibernate databases, and drop routes.
suspended: false

# Labels and annotations stamped onto every rendered resource. The packager sets
# commonLabels to the workspace/project/environment identity; platform discovery
# relies on those labels being present.
commonLabels: {}
commonAnnotations: {}

# imagePullSecrets referenced by every workload pod (set by the packager to the
# workspace's registry pull secret).
imagePullSecrets: []

services: {}

config: {}

sharedVariables: {}

databases:
  postgres: {}
  valkey: {}

# Gateway API parent the HTTPRoutes attach to.
gateway:
  name: lucity-gateway
  namespace: lucity-system
