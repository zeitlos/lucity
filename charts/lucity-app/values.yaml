# Lucity application chart
#
# services:
#   api:
#     image:
#       repository: registry.example.com/myapp/api
#       tag: latest
#       pullPolicy: IfNotPresent
#     port: 3000
#     replicas: 1
#     command: "npm run migrate && node server.js"   # optional; runs via /bin/sh -c
#     env:                                    # literal environment variables
#       LOG_LEVEL: info
#     refs:                                   # env var <- a referenced secret key
#       DATABASE_URL:
#         secret: lucity-app-pg-main-app
#         key: uri
#     domains:
#       - host: api.example.com
#         attached: true                      # false renders the HTTPRoute unattached
#         listenerSet:                        # omit to use a listener the gateway already has
#           enabled: true
#           certificate:
#             issuerRef:
#               kind: ClusterIssuer
#               name: letsencrypt-http01
#     resources:                              # optional — overrides namespace LimitRange
#       requests: { cpu: 100m, memory: 128Mi }
#       limits:   { cpu: 500m, memory: 256Mi }
#     runAsUser: 999                           # optional
#     runAsGroup: 999                          # optional
#     fsGroup: 999                             # optional
#     autoscaling:                            # optional — HPA
#       enabled: true
#       minReplicas: 1
#       maxReplicas: 10
#       targetCPU: 70
#     labels: {}
#     annotations: {}
#     podLabels: {}
#     podAnnotations: {}
#
# sharedVariables:                            # env shared across services (a Secret)
#   SENTRY_DSN: https://...
#
# databases:
#   postgres:
#     main:
#       instances: 1
#       size: 10Gi
#       version: "16"
#       labels: {}
#       annotations: {}
#       backup:
#         serverName: <folder in the archive store, minted by the control plane>
#       restore:                               # bootstrap from another database's archive
#         sourceServerName: <the source's serverName>
#         targetTime: "2026-08-07T14:32:10Z"
#   valkey:                                    # Redis-compatible key-value store
#     cache:
#       size: 1Gi
#       version: "8"
#       password: <generated by the control plane>
#       resources: {}
#       labels: {}
#       annotations: {}
#
# volumes:                                     # standalone persistent disks (RWO)
#   uploads:
#     size: 10Gi
#     labels: {}
#     annotations: {}
#
# A service mounts a volume by name at a path. A mounted service stays single-replica
# and deploys with a Recreate strategy:
#   services:
#     api:
#       volumeMounts:
#         uploads: /data/uploads

nameOverride: ""
fullnameOverride: ""

# Scale every workload to zero, hibernate databases, and drop routes.
suspended: false

# Labels and annotations stamped onto every rendered resource. The packager sets
# commonLabels to the workspace/project/environment identity; platform discovery
# relies on those labels being present.
commonLabels: {}
commonAnnotations: {}

# imagePullSecrets referenced by every workload pod (set by the packager to the
# workspace's registry pull secret).
imagePullSecrets: []

services: {}

sharedVariables: {}

databases:
  postgres: {}
  valkey: {}

  # Where PostgreSQL backups are archived: continuous WAL archiving plus scheduled
  # base backups, via the CloudNativePG barman-cloud plugin.
  #
  # One store for the whole environment, not one per database. That mirrors the
  # underlying resource, which is a destination rather than a database property:
  # every database writes into its own folder underneath destinationPath, named by
  # its own `backup.serverName`. Per-database retention, if it is ever needed, is
  # expressed as a map of folder to window on the store itself.
  #
  # Only the name of a secret appears here. The credentials themselves never
  # become values, because values are what you get when you eject.
  backupStore:
    enabled: false
    endpoint: ""
    destinationPath: ""
    retention: 30d
    schedule: "0 0 2 * * 0"
    jobs: 4
    credentials:
      existingSecret: ""
      secretKeys:
        accessKeyIdKey: accessKeyId
        secretAccessKeyKey: secretAccessKey
        regionKey: region

# Standalone persistent volumes (RWO PVCs), keyed by name, mounted into services via
# services.<name>.volumeMounts.
volumes: {}

# Gateway that this release's HTTPRoutes and ListenerSets attach to.
gateway:
  name: lucity-gateway
  namespace: lucity-system
