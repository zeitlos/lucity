{{- range $name, $pg := .Values.databases.postgres }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "lucity-app.fullname" $ }}-pg-{{ $name }}
  labels:
    {{- include "lucity-app.labels" $ | nindent 4 }}
    app.kubernetes.io/component: postgres-{{ $name }}
    {{- with $.Values.commonLabels }}{{- toYaml . | nindent 4 }}{{- end }}
    {{- with $pg.labels }}{{- toYaml . | nindent 4 }}{{- end }}
  annotations:
    cnpg.io/hibernation: {{ if $.Values.suspended }}"on"{{ else }}"off"{{ end }}
    {{- with $.Values.commonAnnotations }}{{- toYaml . | nindent 4 }}{{- end }}
    {{- with $pg.annotations }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  {{- with $pg.labels }}
  inheritedMetadata:
    labels:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  instances: {{ $pg.instances | default 2 }}
  imageName: ghcr.io/cloudnative-pg/postgresql:{{ $pg.version | default "17" }}-standard-bookworm
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  postgresql:
    shared_preload_libraries:
      - pg_stat_statements
    parameters:
      wal_compression: "on"
      max_wal_size: "2GB"
      checkpoint_completion_target: "0.9"
  replicationSlots:
    highAvailability:
      enabled: true
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  storage:
    size: {{ $pg.size | default "10Gi" }}
  {{- if $pg.resources }}
  resources:
    {{- toYaml $pg.resources | nindent 4 }}
  {{- end }}
  bootstrap:
    initdb:
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
        - CREATE EXTENSION IF NOT EXISTS pg_stat_statements
{{- end }}
