{{- range $name, $vk := .Values.databases.valkey }}
{{- $host := printf "%s-valkey-%s.%s.svc.cluster.local" (include "lucity-app.fullname" $) $name $.Release.Namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lucity-app.fullname" $ }}-valkey-{{ $name }}
  labels:
    {{- include "lucity-app.labels" $ | nindent 4 }}
    app.kubernetes.io/component: valkey-{{ $name }}
    {{- with $.Values.commonLabels }}{{- toYaml . | nindent 4 }}{{- end }}
    {{- with $vk.labels }}{{- toYaml . | nindent 4 }}{{- end }}
type: Opaque
stringData:
  host: {{ $host | quote }}
  port: "6379"
  password: {{ $vk.password | quote }}
  uri: {{ printf "redis://default:%s@%s:6379" $vk.password $host | quote }}
{{- end }}
