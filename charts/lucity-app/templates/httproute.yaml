{{- range $name, $svc := .Values.services }}
{{- if and $svc.image (or $svc.image.tag $svc.image.digest) $svc.port (not $.Values.suspended) }}
{{- range $domain := $svc.domains }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "lucity-app.fullname" $ }}-{{ $name }}-{{ $domain.host | sha1sum | trunc 5 }}
  labels:
    {{- include "lucity-app.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
    {{- with $.Values.commonLabels }}{{- toYaml . | nindent 4 }}{{- end }}
    {{- with $svc.labels }}{{- toYaml . | nindent 4 }}{{- end }}
  {{- if or $.Values.commonAnnotations $svc.annotations }}
  annotations:
    {{- with $.Values.commonAnnotations }}{{- toYaml . | nindent 4 }}{{- end }}
    {{- with $svc.annotations }}{{- toYaml . | nindent 4 }}{{- end }}
  {{- end }}
spec:
  {{- if $domain.attached }}
  parentRefs:
    {{- if and $domain.listenerSet $domain.listenerSet.enabled }}
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ $domain.host | quote }}
    {{- else }}
    - name: {{ $.Values.gateway.name }}
      namespace: {{ $.Values.gateway.namespace }}
    {{- end }}
  {{- end }}
  hostnames:
    - {{ $domain.host | quote }}
  rules:
    {{- if $domain.redirectTo }}
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: {{ $domain.redirectTo | quote }}
            statusCode: 301
    {{- else }}
    - backendRefs:
        - name: {{ include "lucity-app.fullname" $ }}-{{ $name }}
          port: {{ $svc.port }}
      {{- with $.Values.gateway.headerMatches }}
      matches:
        - path:
            type: PathPrefix
            value: /
          headers:
            {{- range . }}
            - type: {{ .type | default "Exact" }}
              name: {{ .name | quote }}
              {{- if .valueFrom }}
              {{- $namespace := .valueFrom.namespace | default $.Values.gateway.namespace }}
              {{- $data := dig "data" .valueFrom.key "" (lookup "v1" "Secret" $namespace .valueFrom.secretName) }}
              value: {{ required (printf "header match %s: secret %s/%s has no key %s" .name $namespace .valueFrom.secretName .valueFrom.key) $data | b64dec | quote }}
              {{- else }}
              value: {{ .value | quote }}
              {{- end }}
            {{- end }}
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
