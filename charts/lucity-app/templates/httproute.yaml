{{- range $name, $svc := .Values.services }}
{{- if and $svc.image $svc.image.tag $svc.port (not $.Values.suspended) }}
{{- $verified := list -}}
{{- range $svc.domains -}}
{{- if .verified -}}
{{- $verified = append $verified . -}}
{{- end -}}
{{- end -}}
{{- if $verified }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "lucity-app.fullname" $ }}-{{ $name }}
  labels:
    {{- include "lucity-app.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
    lucity.dev/service: {{ $name | quote }}
spec:
  parentRefs:
    - name: {{ $.Values.gateway.name | default "lucity-gateway" }}
      {{- if $.Values.gateway.namespace }}
      namespace: {{ $.Values.gateway.namespace }}
      {{- end }}
  hostnames:
    {{- range $verified }}
    - {{ .host | quote }}
    {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "lucity-app.fullname" $ }}-{{ $name }}
          port: {{ $svc.port }}
{{- end }}
{{- end }}
{{- end }}
