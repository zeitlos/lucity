{{- range $name, $svc := .Values.services }}
{{- if $svc.image }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lucity-app.fullname" $ }}-{{ $name }}
  labels:
    {{- include "lucity-app.labels" $ | nindent 4 }}
    {{- include "lucity-app.selectorLabels" (dict "name" $name "release" $.Release.Name) | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
    {{- with $.Values.commonLabels }}{{- toYaml . | nindent 4 }}{{- end }}
    {{- with $svc.labels }}{{- toYaml . | nindent 4 }}{{- end }}
  {{- if or $.Values.commonAnnotations $svc.annotations }}
  annotations:
    {{- with $.Values.commonAnnotations }}{{- toYaml . | nindent 4 }}{{- end }}
    {{- with $svc.annotations }}{{- toYaml . | nindent 4 }}{{- end }}
  {{- end }}
spec:
  {{- if $.Values.suspended }}
  replicas: 0
  {{- else if and (not $svc.image.tag) (not $svc.image.digest) }}
  replicas: 0
  {{- else if not (and $svc.autoscaling $svc.autoscaling.enabled) }}
  replicas: {{ $svc.replicas | default 1 }}
  {{- end }}
  {{- if $svc.volumeMounts }}
  strategy:
    type: Recreate
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "lucity-app.selectorLabels" (dict "name" $name "release" $.Release.Name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lucity-app.labels" $ | nindent 8 }}
        {{- include "lucity-app.selectorLabels" (dict "name" $name "release" $.Release.Name) | nindent 8 }}
        {{- with $.Values.commonLabels }}{{- toYaml . | nindent 8 }}{{- end }}
        {{- with $svc.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      {{- $sharedSecret := printf "%s-shared" (include "lucity-app.fullname" $) }}
      {{- $variablesHash := toYaml $svc.env }}
      {{- range $svc.refs }}
      {{- if eq .secret $sharedSecret }}
      {{- $variablesHash = printf "%s\n%s=%v" $variablesHash .key (index $.Values.sharedVariables .key) }}
      {{- end }}
      {{- end }}
      annotations:
        checksum/variables: {{ $variablesHash | sha256sum }}
        {{- with $.Values.commonAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
        {{- with $svc.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      hostUsers: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- if hasKey $svc "runAsUser" }}
        runAsUser: {{ $svc.runAsUser }}
        {{- end }}
        {{- if hasKey $svc "runAsGroup" }}
        runAsGroup: {{ $svc.runAsGroup }}
        {{- end }}
        {{- if hasKey $svc "fsGroup" }}
        fsGroup: {{ $svc.fsGroup }}
        fsGroupChangePolicy: OnRootMismatch
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ include "lucity-app.image" $svc.image | quote }}
          imagePullPolicy: {{ $svc.image.pullPolicy | default "IfNotPresent" }}
          {{- with $svc.command }}
          command: ["/bin/sh", "-c"]
          args: [{{ . | quote }}]
          {{- end }}
          {{- if $svc.port }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
              protocol: TCP
          {{- $hc := $svc.healthCheck | default dict }}
          {{- if $hc.path }}
          {{- $probePort := $hc.port | default $svc.port }}
          {{- if $hc.startupFailureThreshold }}
          startupProbe:
            httpGet:
              path: {{ $hc.path }}
              port: {{ $probePort }}
            periodSeconds: {{ $hc.periodSeconds | default 5 }}
            timeoutSeconds: {{ $hc.timeoutSeconds | default 3 }}
            failureThreshold: {{ $hc.startupFailureThreshold }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ $hc.path }}
              port: {{ $probePort }}
            {{- with $hc.initialDelaySeconds }}
            initialDelaySeconds: {{ . }}
            {{- end }}
            periodSeconds: {{ $hc.periodSeconds | default 5 }}
            timeoutSeconds: {{ $hc.timeoutSeconds | default 3 }}
            failureThreshold: {{ $hc.failureThreshold | default 3 }}
          {{- else }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "10"]
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: {{ include "lucity-app.fullname" $ }}-{{ $name }}-variables
          env:
            {{- $env := $svc.env | default dict }}
            {{- $refs := $svc.refs | default dict }}
            {{- if $svc.port }}
            {{- if not (or (hasKey $env "HOST") (hasKey $refs "HOST")) }}
            - name: HOST
              value: "0.0.0.0"
            {{- end }}
            {{- if not (or (hasKey $env "PORT") (hasKey $refs "PORT")) }}
            - name: PORT
              value: {{ $svc.port | quote }}
            {{- end }}
            {{- end }}
            {{- range $key, $ref := $refs }}
            - name: {{ $key | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.secret | quote }}
                  key: {{ $ref.key | quote }}
            {{- end }}
          {{- with $svc.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $svc.volumeMounts }}
          volumeMounts:
            {{- range $volName, $path := . }}
            - name: volume-{{ $volName }}
              mountPath: {{ $path | quote }}
              subPath: data
            {{- end }}
          {{- end }}
      {{- with $svc.volumeMounts }}
      volumes:
        {{- range $volName, $path := . }}
        - name: volume-{{ $volName }}
          persistentVolumeClaim:
            claimName: {{ include "lucity-app.fullname" $ }}-volume-{{ $volName }}
        {{- end }}
      {{- end }}
{{- end }}
{{- end }}
