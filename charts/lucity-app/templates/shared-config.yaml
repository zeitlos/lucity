{{- if .Values.sharedVariables }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lucity-app.fullname" $ }}-shared
  labels:
    {{- include "lucity-app.labels" $ | nindent 4 }}
    lucity.dev/shared-variables: "true"
data:
  {{- range $key, $val := .Values.sharedVariables }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
