{{- if and .Values.verticalPodAutoscaler.enabled (.Capabilities.APIVersions.Has "autoscaling.k8s.io/v1/VerticalPodAutoscaler") }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.image }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "lucity-app.fullname" $ }}-{{ $name }}
  labels:
    {{- include "lucity-app.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
    {{- with $.Values.commonLabels }}{{- toYaml . | nindent 4 }}{{- end }}
    {{- with $svc.labels }}{{- toYaml . | nindent 4 }}{{- end }}
  {{- if or $.Values.commonAnnotations $svc.annotations }}
  annotations:
    {{- with $.Values.commonAnnotations }}{{- toYaml . | nindent 4 }}{{- end }}
    {{- with $svc.annotations }}{{- toYaml . | nindent 4 }}{{- end }}
  {{- end }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "lucity-app.fullname" $ }}-{{ $name }}
  updatePolicy:
    updateMode: {{ $.Values.verticalPodAutoscaler.updatePolicy.updateMode | quote }}
  resourcePolicy:
    containerPolicies:
      - containerName: {{ $name }}
        controlledValues: RequestsOnly
        {{- if and $svc.autoscaling $svc.autoscaling.enabled }}
        controlledResources: [memory]
        {{- else }}
        controlledResources: [cpu, memory]
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
