{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lucity-agent.fullname" . }}-deny-ingress
  labels:
    {{- include "lucity-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lucity-agent.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "lucity-agent.fullname" . }}-egress
  labels:
    {{- include "lucity-agent.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "lucity-agent.selectorLabels" . | nindent 6 }}
  egress:
    - toEndpoints:
        - matchLabels:
            {{- toYaml .Values.networkPolicy.dnsSelector | nindent 12 }}
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    {{- if .Values.networkPolicy.kubeAPIServer }}
    - toEntities:
        - kube-apiserver
    {{- end }}
    {{- range .Values.networkPolicy.endpoints }}
    - toEndpoints:
        - matchLabels:
            {{- toYaml .selector | nindent 12 }}
      toPorts:
        - ports:
            {{- range .ports }}
            - port: {{ . | quote }}
              protocol: TCP
            {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.fqdns }}
    - toFQDNs:
        {{- range . }}
        - matchName: {{ . | quote }}
        {{- end }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- end }}
{{- end }}
