{{- if .Values.otelCollector.deployment.enabled }}
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: {{ .Release.Name }}-otel-gateway
  labels:
    app.kubernetes.io/name: otel-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: observability
spec:
  mode: deployment
  replicas: {{ .Values.otelCollector.deployment.replicas }}
  serviceAccount: {{ .Release.Name }}-otel-collector
  resources:
    {{- toYaml .Values.otelCollector.deployment.resources | nindent 4 }}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: opentelemetry-collector
          app.kubernetes.io/instance: {{ .Release.Namespace }}.{{ .Release.Name }}-otel-gateway
  config:
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      k8s_leader_elector:
        auth_type: serviceAccount
        lease_name: {{ .Release.Name }}-otel-gateway-events
        lease_namespace: {{ .Release.Namespace }}
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            max_recv_msg_size_mib: 32
          http:
            endpoint: 0.0.0.0:4318
      k8s_events:
        auth_type: serviceAccount
        k8s_leader_elector: k8s_leader_elector
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      transform/static-targets:
        error_mode: ignore
        metric_statements:
          - conditions:
              - IsMatch(resource.attributes["service.name"], "^(kube-state-metrics|cert-manager|victoria-metrics|hcloud-exporter)$")
            statements:
              - delete_matching_keys(resource.attributes, "^k8s[.]")
      filter/cilium-agent:
        error_mode: ignore
        metric_conditions:
          - resource.attributes["service.name"] == "cilium-agent" and not IsMatch(metric.name, "^(up|cilium_(drop_count|bpf_map_pressure|errors_warnings|endpoint_regenerations|unreachable_nodes|unreachable_health_endpoints)(_total)?)$")
    exporters:
      # k8s collector distribution doesn't ship prometheusremotewrite,
      # so use VictoriaMetrics' native OTLP endpoint instead.
      otlp_http/metrics:
        metrics_endpoint: http://{{ .Release.Name }}-victoria-metrics-single-server:8428/opentelemetry/v1/metrics
        tls:
          insecure: true
        timeout: 10s
        sending_queue:
          enabled: false
        retry_on_failure:
          enabled: false
      otlp_http/logs:
        logs_endpoint: http://{{ .Release.Name }}-victoria-logs-single-server:9428/insert/opentelemetry/v1/logs
        tls:
          insecure: true
        timeout: 10s
        sending_queue:
          enabled: false
        retry_on_failure:
          enabled: false
    service:
      extensions: [health_check, k8s_leader_elector]
      telemetry:
        logs:
          level: info
        resource:
          attributes:
            - name: service.name
              value: otel-gateway
        {{- include "lucity-infra.otel.selfTelemetry" . | nindent 8 }}
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, transform/static-targets, filter/cilium-agent]
          exporters: [otlp_http/metrics]
        logs:
          receivers: [otlp, k8s_events]
          processors: [memory_limiter]
          exporters: [otlp_http/logs]
{{- end }}
