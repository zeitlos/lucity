{{- if .Values.rybbit.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rybbit-valkey
  labels:
    app.kubernetes.io/name: rybbit-valkey
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: analytics
spec:
  type: ClusterIP
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
      protocol: TCP
  selector:
    app.kubernetes.io/name: rybbit-valkey
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
