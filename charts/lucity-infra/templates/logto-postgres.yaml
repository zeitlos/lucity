{{- if .Values.logto.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-logto-pg
  labels:
    app.kubernetes.io/name: logto-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: identity-provider
spec:
  instances: {{ .Values.logto.postgres.instances | default 1 }}
  {{- if .Values.logto.postgres.version }}
  imageName: ghcr.io/cloudnative-pg/postgresql:{{ .Values.logto.postgres.version }}
  {{- end }}
  enableSuperuserAccess: true
  {{- if .Values.backups.enabled }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ .Release.Name }}-platform-backups
        serverName: {{ .Release.Name }}-logto-pg
  {{- end }}
  bootstrap:
    initdb:
      database: logto
      owner: app
  storage:
    size: {{ .Values.logto.postgres.size | default "1Gi" }}
    {{- if .Values.logto.postgres.storageClass }}
    storageClass: {{ .Values.logto.postgres.storageClass | quote }}
    {{- end }}
{{- if .Values.backups.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .Release.Name }}-logto-pg
  labels:
    app.kubernetes.io/name: logto-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: identity-provider
spec:
  schedule: {{ .Values.backups.schedule | default "0 0 2 * * 0" | quote }}
  immediate: true
  backupOwnerReference: cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: {{ .Release.Name }}-logto-pg
{{- end }}
{{- end }}
