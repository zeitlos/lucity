{{- if .Values.otelCollector.daemonset.enabled }}
{{- if not .Values.otelCollector.deployment.enabled }}
{{- fail "otelCollector.daemonset exports to the gateway: enable otelCollector.deployment too" }}
{{- end }}
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: {{ .Release.Name }}-otel-agent
  labels:
    app.kubernetes.io/name: otel-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: observability
spec:
  mode: daemonset
  serviceAccount: {{ .Release.Name }}-otel-collector
  tolerations:
    - operator: Exists
  resources:
    {{- toYaml .Values.otelCollector.daemonset.resources | nindent 4 }}
  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    # Used for the kubelet_stats endpoint — node hostnames aren't resolvable
    # via CoreDNS, but the host IP is.
    - name: K8S_NODE_IP
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
    - name: K8S_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: K8S_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
    - name: hostfs
      hostPath:
        path: /
    - name: queue
      emptyDir:
        sizeLimit: {{ .Values.otelCollector.daemonset.queue.sizeLimit }}
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
    - name: hostfs
      mountPath: /hostfs
      readOnly: true
      mountPropagation: HostToContainer
    - name: queue
      mountPath: /var/lib/otelcol/queue
  config:
    extensions:
      file_storage:
        directory: /var/lib/otelcol/queue
        compaction:
          on_rebound: true
          directory: /var/lib/otelcol/queue
    receivers:
      kubelet_stats:
        collection_interval: 30s
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_IP}:10250
        insecure_skip_verify: true
        metric_groups: [node, pod, container, volume]
      host_metrics:
        collection_interval: 30s
        root_path: /hostfs
        scrapers:
          cpu: {}
          memory: {}
          disk: {}
          load: {}
          network: {}
          filesystem:
            exclude_mount_points:
              mount_points: ["/dev/*", "/proc/*", "/sys/*", "/run/*", "/var/lib/docker/*", "/var/lib/kubelet/*", "/snap/*"]
              match_type: regexp
            exclude_fs_types:
              fs_types: ["overlay", "squashfs", "tmpfs", "devtmpfs"]
              match_type: strict
      file_log:
        include: [/var/log/pods/*/*/*.log]
        # Don't tail the agent's own logs (would create a loop)
        exclude: [/var/log/pods/{{ .Release.Namespace }}_{{ .Release.Name }}-otel-agent-*_*/otc-container/*.log]
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          - type: container
            id: container-parser
            format: containerd
      prometheus:
        config:
          scrape_configs:
            - job_name: kube-state-metrics
              scrape_interval: 30s
              {{- include "lucity-infra.otel.nodeLocalPods" "kube-system" | nindent 14 }}
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
                  regex: kube-state-metrics;http
                  action: keep
                - target_label: instance
                  replacement: kube-state-metrics.kube-system.svc.cluster.local:8080
            - job_name: cilium-agent
              scrape_interval: 30s
              {{- include "lucity-infra.otel.nodeLocalPods" "kube-system" | nindent 14 }}
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_k8s_app, __meta_kubernetes_pod_container_port_name]
                  regex: cilium;prometheus
                  action: keep
            - job_name: cilium-envoy
              scrape_interval: 30s
              {{- include "lucity-infra.otel.nodeLocalPods" "kube-system" | nindent 14 }}
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_k8s_app, __meta_kubernetes_pod_container_port_name]
                  regex: cilium-envoy;envoy-metrics
                  action: keep
            - job_name: hubble
              scrape_interval: 30s
              {{- include "lucity-infra.otel.nodeLocalPods" "kube-system" | nindent 14 }}
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_k8s_app, __meta_kubernetes_pod_container_port_name]
                  regex: cilium;hubble-metrics
                  action: keep
            - job_name: cert-manager
              scrape_interval: 60s
              {{- include "lucity-infra.otel.nodeLocalPods" "cert-manager" | nindent 14 }}
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_label_app_kubernetes_io_component, __meta_kubernetes_pod_container_port_name]
                  regex: cert-manager;controller;http-metrics
                  action: keep
                - target_label: instance
                  replacement: cert-manager.cert-manager.svc.cluster.local:9402
            - job_name: victoria-metrics
              scrape_interval: 30s
              {{- include "lucity-infra.otel.nodeLocalPods" .Release.Namespace | nindent 14 }}
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
                  regex: victoria-metrics-single;http
                  action: keep
                - target_label: instance
                  replacement: {{ .Release.Name }}-victoria-metrics-single-server:8428
            {{- if index .Values "hcloud-exporter" "enabled" }}
            - job_name: hcloud-exporter
              scrape_interval: 60s
              {{- include "lucity-infra.otel.nodeLocalPods" .Release.Namespace | nindent 14 }}
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
                  regex: hcloud-exporter;http
                  action: keep
                - target_label: instance
                  replacement: {{ .Release.Name }}-hcloud-exporter:9501
            {{- end }}
            - job_name: otel-agent
              scrape_interval: 30s
              {{- include "lucity-infra.otel.nodeLocalPods" .Release.Namespace | nindent 14 }}
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
                  regex: otel-agent;metrics
                  action: keep
            - job_name: otel-gateway
              scrape_interval: 30s
              {{- include "lucity-infra.otel.nodeLocalPods" .Release.Namespace | nindent 14 }}
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
                  regex: otel-gateway;metrics
                  action: keep
            {{- if index .Values "vertical-pod-autoscaler" "enabled" }}
            - job_name: vertical-pod-autoscaler
              scrape_interval: 30s
              {{- include "lucity-infra.otel.nodeLocalPods" .Release.Namespace | nindent 14 }}
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
                  regex: vertical-pod-autoscaler;prometheus
                  action: keep
            {{- end }}
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      # Drop high-cardinality resource attributes that kubelet_stats/host_metrics
      # emit by default. container.id changes on every pod restart and would
      # accumulate within the retention window; k8s.pod.uid changes on every
      # reschedule. Labels like `replicaset` and `uid` on KSM metrics are
      # bounded by K8s revisionHistoryLimit and current cluster state and are
      # not addressed here (they're metric-level labels on prom-scraped data,
      # not resource attributes on OTLP data).
      resource:
        attributes:
          - key: container.id
            action: delete
          - key: k8s.pod.uid
            action: delete
      k8s_attributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.deployment.name
            - k8s.node.name
            - k8s.container.name
          labels:
            - tag_name: workspace
              key: lucity.dev/workspace
              from: namespace
            - tag_name: project
              key: lucity.dev/project
              from: namespace
            - tag_name: environment
              key: lucity.dev/environment
              from: namespace
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection
      batch:
        send_batch_size: 8192
        send_batch_max_size: 8192
        timeout: 5s
    exporters:
      otlp_grpc:
        endpoint: dns:///{{ .Release.Name }}-otel-gateway-collector-headless.{{ .Release.Namespace }}.svc.cluster.local:4317
        balancer_name: round_robin
        tls:
          insecure: true
        timeout: 15s
        sending_queue:
          storage: file_storage
          sizer: bytes
          queue_size: {{ .Values.otelCollector.daemonset.queue.bytes | int64 }}
        retry_on_failure:
          max_elapsed_time: 0
    service:
      extensions: [file_storage]
      telemetry:
        logs:
          level: info
      pipelines:
        metrics:
          receivers: [host_metrics, kubelet_stats, prometheus]
          processors: [memory_limiter, k8s_attributes, resource, batch]
          exporters: [otlp_grpc]
        logs:
          receivers: [file_log]
          processors: [memory_limiter, k8s_attributes, resource, batch]
          exporters: [otlp_grpc]
{{- end }}
