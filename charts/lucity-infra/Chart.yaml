apiVersion: v2
name: lucity-infra
description: Lucity platform infrastructure — OCI registry (Zot) and PostgreSQL operator (CNPG)
type: application
version: 0.1.0
appVersion: "0.1.0"

dependencies:
  - name: zot
    version: "0.1.122"
    repository: "http://zotregistry.dev/helm-charts"
    condition: zot.enabled
  - name: cloudnative-pg
    version: "0.29.0"
    repository: "https://cloudnative-pg.github.io/charts"
    condition: cloudnative-pg.enabled
  - name: plugin-barman-cloud
    version: "0.7.1"
    repository: "https://cloudnative-pg.github.io/charts"
    condition: plugin-barman-cloud.enabled
  - name: victoria-metrics-single
    version: "0.43.0"
    repository: "https://victoriametrics.github.io/helm-charts/"
    condition: victoria-metrics-single.enabled
  - name: victoria-logs-single
    version: "0.13.9"
    repository: "https://victoriametrics.github.io/helm-charts/"
    condition: victoria-logs-single.enabled
  - name: victoria-metrics-alert
    version: "0.45.0"
    repository: "https://victoriametrics.github.io/helm-charts/"
    condition: victoria-metrics-alert.enabled
  - name: opentelemetry-operator
    version: "0.117.0"
    repository: "https://open-telemetry.github.io/opentelemetry-helm-charts"
    condition: opentelemetry-operator.enabled
  - name: grafana
    version: "12.10.2"
    repository: "https://grafana-community.github.io/helm-charts"
    condition: grafana.enabled
  - name: traefik
    version: "41.1.1"
    repository: "https://traefik.github.io/charts"
    condition: traefik.enabled
