# Lucity infrastructure chart — Zot (OCI registry) + Gateway API + CNPG (PostgreSQL)

# -- Zot OCI Registry
zot:
  enabled: true
  persistence: false
  pvc:
    create: false
    storage: 8Gi
    storageClassName: null
  service:
    type: ClusterIP
    port: 5000

# -- Gateway resource configuration
# Set enabled: true and configure listeners for your environment.
# className: "eg" for Envoy Gateway, "cilium" for Cilium Gateway API.
gateway:
  enabled: true
  name: lucity-gateway
  className: eg
  # Custom domain listeners are managed by the deployer, not by this chart.
  listeners:
    - name: http
      protocol: HTTP
      port: 80

# -- cert-manager ClusterIssuer resources
clusterIssuers: []

# -- cert-manager Certificate resources
certificates: []

# -- CloudNativePG Operator (PostgreSQL)
cloudnative-pg:
  enabled: true

# -- Barman Cloud plugin (CNPG-I) — WAL archiving and base backups for CNPG.
plugin-barman-cloud:
  enabled: true
  replicaCount: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: plugin-barman-cloud
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

# -- Traefik — Postgres SNI router for exposing user databases on :5432
traefik:
  enabled: false
  deployment:
    replicas: 2
  providers:
    kubernetesCRD:
      enabled: true
    kubernetesIngress:
      enabled: false
  ingressRoute:
    dashboard:
      enabled: false
  ports:
    web:
      expose:
        default: false
    websecure:
      expose:
        default: false
    postgres:
      port: 5432
      exposedPort: 5432
      expose:
        default: true
      protocol: TCP
  service:
    spec:
      type: LoadBalancer

# -- Rybbit Web Analytics (ClickHouse + CNPG PostgreSQL + Backend + Client)
rybbit:
  enabled: false
  hostname: ""

  backend:
    image:
      repository: ghcr.io/rybbit-io/rybbit-backend
      tag: latest
      pullPolicy: IfNotPresent
    port: 3001
    baseUrl: ""
    disableSignup: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  client:
    image:
      repository: ghcr.io/rybbit-io/rybbit-client
      tag: latest
      pullPolicy: IfNotPresent
    port: 3002
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  clickhouse:
    image:
      repository: clickhouse/clickhouse-server
      tag: "25.4.2"
      pullPolicy: IfNotPresent
    port: 8123
    database: analytics
    user: default
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""
      accessMode: ReadWriteOnce
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

  postgres:
    instances: 1
    size: 5Gi
    storageClass: ""
    version: "17"
    database: analytics

  secrets:
    clickhousePassword: ""
    betterAuthSecret: ""

# -- VictoriaMetrics single-node — metrics storage
victoria-metrics-single:
  enabled: false
  server:
    # Default "1" means 1 MONTH; set explicitly so we know what we're getting.
    retentionPeriod: "30d"
    extraArgs:
      # Convert OTLP metric names and labels to Prometheus form on ingest.
      # Affects only OTLP-pushed metrics (hostmetrics, kubeletstats); prometheus-scraped
      # ones (KSM, Cilium) are already Prom-named. Lets us reuse community dashboards.
      "opentelemetry.usePrometheusNaming": "true"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

# -- VictoriaLogs single-node — logs storage
victoria-logs-single:
  enabled: false
  server:
    retentionPeriod: "14d"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

# -- vmalert + bundled Alertmanager (Telegram notifier)
victoria-metrics-alert:
  enabled: false
  server:
    extraArgs:
      configCheckInterval: "30s"
    datasource:
      url: "http://lucity-infra-victoria-metrics-single-server:8428"
    notifier:
      url: "http://lucity-infra-victoria-metrics-alert-alertmanager:9093"
    remoteWrite:
      url: "http://lucity-infra-victoria-metrics-single-server:8428"
    remoteRead:
      url: "http://lucity-infra-victoria-metrics-single-server:8428"
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
    config:
      alerts:
        groups:
          - name: platform
            rules:
              - alert: NodeNotReady
                expr: kube_node_status_condition{condition="Ready",status="true"} == 0
                for: 5m
                labels: { severity: critical }
                annotations:
                  summary: "Node {{ $labels.node }} is not Ready"
              - alert: PodCrashLoopBackOff
                expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff", namespace=~"kube-system|lucity-system|lucity-builds"} == 1
                for: 15m
                labels: { severity: warning }
                annotations:
                  summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
              - alert: ContainerRestartingRepeatedly
                expr: increase(kube_pod_container_status_restarts_total{namespace=~"kube-system|lucity-system"}[1h]) >= 3
                for: 5m
                labels: { severity: warning }
                annotations:
                  summary: "{{ $labels.namespace }}/{{ $labels.pod }} restarted {{ $value | humanize }} times in the last hour"
              - alert: PVCNearlyFull
                expr: |-
                  label_replace(label_replace(label_replace(
                    (1 - k8s_volume_available_bytes / k8s_volume_capacity_bytes),
                    "namespace", "$1", "k8s_namespace_name", "(.*)"),
                    "pod", "$1", "k8s_pod_name", "(.*)"),
                    "volume", "$1", "k8s_volume_name", "(.*)")
                  * on (namespace, pod, volume) group_left(persistentvolumeclaim)
                    kube_pod_spec_volumes_persistentvolumeclaims_info{namespace=~"lucity-system|lucity-builds"}
                  > 0.85
                for: 10m
                labels: { severity: warning }
                annotations:
                  summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} >85% full"
              - alert: PVCCriticallyFull
                expr: |-
                  label_replace(label_replace(label_replace(
                    (1 - k8s_volume_available_bytes / k8s_volume_capacity_bytes),
                    "namespace", "$1", "k8s_namespace_name", "(.*)"),
                    "pod", "$1", "k8s_pod_name", "(.*)"),
                    "volume", "$1", "k8s_volume_name", "(.*)")
                  * on (namespace, pod, volume) group_left(persistentvolumeclaim)
                    kube_pod_spec_volumes_persistentvolumeclaims_info{namespace=~"lucity-system|lucity-builds"}
                  > 0.95
                for: 5m
                labels: { severity: critical }
                annotations:
                  summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} >95% full"
              - alert: CertExpiringSoon
                expr: certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 86400
                for: 1h
                labels: { severity: warning }
                annotations:
                  summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in <14d"
              - alert: CertificateNotReady
                expr: certmanager_certificate_ready_status{condition="True"} == 0
                for: 1h
                labels: { severity: warning }
                annotations:
                  summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} not Ready for >1h"
              - alert: ZotDown
                expr: kube_statefulset_status_replicas_ready{namespace="lucity-system", statefulset=~".*zot.*"} == 0
                for: 5m
                labels: { severity: critical }
                annotations:
                  summary: "Zot registry is down"
              - alert: VictoriaMetricsHighCardinality
                expr: vm_cache_entries{type="storage/hour_metric_ids"} > 500000
                for: 1h
                labels: { severity: warning }
                annotations:
                  summary: "VictoriaMetrics active series >500k — investigate top metrics with /api/v1/status/tsdb"
          - name: postgres-backups
            rules:
              - alert: BarmanPluginDown
                expr: kube_deployment_status_replicas_available{namespace="lucity-system", deployment=~".*plugin-barman-cloud"} == 0
                for: 5m
                labels: { severity: critical }
                annotations:
                  summary: "Barman Cloud plugin is down — CNPG cannot reconcile any database"
              - alert: PostgresVolumeNearlyFull
                expr: |-
                  label_replace(label_replace(label_replace(
                    (1 - k8s_volume_available_bytes / k8s_volume_capacity_bytes),
                    "namespace", "$1", "k8s_namespace_name", "(.*)"),
                    "pod", "$1", "k8s_pod_name", "(.*)"),
                    "volume", "$1", "k8s_volume_name", "(.*)")
                  * on (namespace, pod, volume) group_left(persistentvolumeclaim)
                    kube_pod_spec_volumes_persistentvolumeclaims_info{persistentvolumeclaim=~"lucity-app-pg-.*"}
                  > 0.85
                for: 10m
                labels: { severity: warning }
                annotations:
                  summary: "Database volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} >85% full — check WAL archiving"
              - alert: PostgresVolumeCriticallyFull
                expr: |-
                  label_replace(label_replace(label_replace(
                    (1 - k8s_volume_available_bytes / k8s_volume_capacity_bytes),
                    "namespace", "$1", "k8s_namespace_name", "(.*)"),
                    "pod", "$1", "k8s_pod_name", "(.*)"),
                    "volume", "$1", "k8s_volume_name", "(.*)")
                  * on (namespace, pod, volume) group_left(persistentvolumeclaim)
                    kube_pod_spec_volumes_persistentvolumeclaims_info{persistentvolumeclaim=~"lucity-app-pg-.*"}
                  > 0.95
                for: 5m
                labels: { severity: critical }
                annotations:
                  summary: "Database volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} >95% full — primary will go read-only"
          - name: edge-gateway
            rules:
              # Sustained Envoy-generated 5xx on the public listeners.
              # Catches Cilium L7 issues (e.g. the IPv6 incident on 2026-05-01),
              # broken HTTPRoutes, TLS misconfig, upstream resets. Pair with
              # GatewayUpstream5xxRate below to distinguish "gateway is broken"
              # from "upstream service is broken".
              - alert: GatewayHigh5xxRate
                expr: sum by (envoy_http_conn_manager_prefix) (rate(envoy_http_downstream_rq_xx_total{envoy_response_code_class="5",envoy_http_conn_manager_prefix=~"listener-(secure|insecure)"}[5m])) > 0.1
                for: 5m
                labels: { severity: warning }
                annotations:
                  summary: "Gateway returning 5xx on {{ $labels.envoy_http_conn_manager_prefix }} ({{ $value | humanize }} req/s)"
              # 5xx originating from upstream services (gateway, dashboard, docs, …).
              - alert: GatewayUpstream5xxRate
                expr: sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx_total{envoy_response_code_class="5",envoy_cluster_name=~"lucity-system/cilium-gateway-.*"}[5m])) > 0.1
                for: 10m
                labels: { severity: warning }
                annotations:
                  summary: "Upstream service 5xx: {{ $labels.envoy_cluster_name }} ({{ $value | humanize }} req/s)"
              # TLS handshake errors — cert/SNI mismatch, expired cert, or Cilium L4 issue.
              - alert: GatewayTLSHandshakeErrors
                expr: sum(rate(envoy_listener_ssl_connection_error_total[5m])) > 0.5
                for: 10m
                labels: { severity: warning }
                annotations:
                  summary: "Elevated TLS handshake errors on the gateway ({{ $value | humanize }}/s)"
              # Cannot connect to upstream pod — pod down, NetworkPolicy blocking, wrong port.
              - alert: GatewayUpstreamConnectFail
                expr: sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_cx_connect_fail_total{envoy_cluster_name=~"lucity-system/cilium-gateway-.*"}[5m])) > 0.1
                for: 5m
                labels: { severity: warning }
                annotations:
                  summary: "Cannot connect to upstream {{ $labels.envoy_cluster_name }} ({{ $value | humanize }}/s)"
  alertmanager:
    enabled: false
    extraVolumes:
      - name: telegram-token
        secret:
          secretName: lucity-infra-alertmanager-telegram
    extraVolumeMounts:
      - name: telegram-token
        mountPath: /etc/alertmanager/secrets
        readOnly: true
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 128Mi
    config:
      global:
        resolve_timeout: 5m
      route:
        receiver: telegram
        group_by: [alertname, severity]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          - matchers: [severity="critical"]
            repeat_interval: 1h
      inhibit_rules:
        - source_matchers: [alertname="NodeNotReady"]
          target_matchers: [severity=~"warning|critical"]
          equal: [node]
      receivers:
        - name: telegram
          telegram_configs:
            - bot_token_file: /etc/alertmanager/secrets/bot_token
              # chat_id is populated in the prod overlay (numeric, can be negative for groups)
              chat_id: 0
              parse_mode: HTML
              send_resolved: true
              # Custom message keeps only useful labels — drops OTEL prom-receiver
              # scrape metadata (scope_*, server_*, service_*, url_scheme, uid).
              message: |-
                <b>{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}</b> ({{ .CommonLabels.severity }})
                {{ range .Alerts }}
                {{ .Annotations.summary }}
                {{- with .Labels.namespace }}
                • namespace: <code>{{ . }}</code>{{ end }}
                {{- with .Labels.pod }}
                • pod: <code>{{ . }}</code>{{ end }}
                {{- with .Labels.container }}
                • container: <code>{{ . }}</code>{{ end }}
                {{- with .Labels.node }}
                • node: <code>{{ . }}</code>{{ end }}
                {{- with .Labels.persistentvolumeclaim }}
                • pvc: <code>{{ . }}</code>{{ end }}
                {{- with .Labels.name }}
                • name: <code>{{ . }}</code>{{ end }}
                {{- with .Labels.reason }}
                • reason: <code>{{ . }}</code>{{ end }}
                {{- with .Labels.job }}
                • job: <code>{{ . }}</code>{{ end }}
                {{ end }}

# -- OpenTelemetry Operator (provides OpenTelemetryCollector + Instrumentation CRDs)
opentelemetry-operator:
  enabled: false
  # Default collector image is the k8s distribution which includes every receiver
  # we use (kubeletstats, k8s_cluster, prometheus, filelog, k8s_events, k8sattributes).
  # cert-manager is required and already installed in lucity-prod via flex.plane.

# -- OpenTelemetry Collector instances (rendered as OpenTelemetryCollector CRs)
otelCollector:
  daemonset:
    enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
  deployment:
    enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

# -- Grafana — UI for VictoriaMetrics + VictoriaLogs
grafana:
  enabled: false
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  plugins:
    - victoriametrics-logs-datasource
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: VictoriaMetrics
          type: prometheus
          uid: victoriametrics
          access: proxy
          url: http://lucity-infra-victoria-metrics-single-server:8428
          isDefault: true
          editable: false
          jsonData:
            httpMethod: POST
            timeInterval: 30s
        - name: VictoriaLogs
          type: victoriametrics-logs-datasource
          uid: victorialogs
          access: proxy
          url: http://lucity-infra-victoria-logs-single-server:9428
          editable: false
  envFromSecret: lucity-infra-grafana-oauth
  grafana.ini:
    server:
      # CRITICAL for port-forward access; OIDC redirect breaks otherwise.
      # Override per-environment if Grafana is exposed via a real hostname.
      root_url: "http://localhost:3000/"
    analytics:
      check_for_updates: false
      reporting_enabled: false
    auth:
      disable_login_form: false
      oauth_auto_login: false
    auth.generic_oauth:
      enabled: true
      name: Lucity
      allow_sign_up: true
      client_id: ""
      client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      scopes: "openid profile email roles"
      auth_url: ""
      token_url: ""
      api_url: ""
      use_pkce: true
      # Only users with the `lucity-system-admin` Logto role can sign in.
      # JMESPath returns an empty string for non-admins; combined with
      # role_attribute_strict: true, that rejects the login outright
      # (rather than falling back to Viewer).
      role_attribute_path: "contains(roles[*], 'lucity-system-admin') && 'GrafanaAdmin' || ''"
      role_attribute_strict: true
      allow_assign_grafana_admin: true

# -- Grafana OIDC client secret (Logto). Populated via deployment overlay.
grafanaOIDC:
  clientSecret: ""

# -- Telegram bot token for Alertmanager. Populated via deployment overlay.
alertingTelegram:
  botToken: ""

# -- Logto Identity Provider (OIDC + Organizations)
logto:
  enabled: false
  image:
    repository: ghcr.io/logto-io/logto
    tag: "1.37.1"
    pullPolicy: IfNotPresent
  endpoint: ""              # public URL, e.g. https://id.lucity.cloud
  postgres:
    instances: 1
    size: 1Gi
    storageClass: ""
    version: "17"
  service:
    type: ClusterIP
    port: 3001
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  secrets:
    # M2M app credentials for Management API access (created in Logto admin console)
    m2mAppId: ""
    m2mAppSecret: ""
    secretVaultKek: ""    # base64-encoded 32-byte KEK for Secret Vault (token storage)

