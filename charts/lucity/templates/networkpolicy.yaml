# Default deny-all ingress for platform pods managed by this chart.
# Each service explicitly allows traffic via its own NetworkPolicy below.
# Scoped to pods with the lucity instance label so infra pods (Logto, Zot)
# managed by the lucity-infra chart are unaffected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lucity.fullname" . }}-default-deny
  labels:
    {{- include "lucity.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress: []
---
# Conductor: HTTP from anywhere (Gateway API ingress for GraphQL +
# auth + dashboard API), webhook port from anywhere (GitHub events),
# gRPC port from within the namespace (cashier callback).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lucity.fullname" . }}-conductor
  labels:
    {{- include "lucity.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lucity.selectorLabels" (dict "name" "conductor" "release" .Release.Name) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # HTTP (GraphQL + auth + health) — internet-facing via Gateway API
    - ports:
        - port: {{ .Values.conductor.httpPort }}
          protocol: TCP
    # Webhook (GitHub events) — internet-facing
    - ports:
        - port: {{ .Values.conductor.webhookPort }}
          protocol: TCP
    # gRPC (cashier callbacks) — namespace-internal only
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.conductor.grpcPort }}
          protocol: TCP
---
# Dashboard: allow ingress from any source (internet-facing)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lucity.fullname" . }}-dashboard
  labels:
    {{- include "lucity.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lucity.selectorLabels" (dict "name" "dashboard" "release" .Release.Name) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.dashboard.port }}
          protocol: TCP
---
# Docs: allow ingress from any source (internet-facing)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lucity.fullname" . }}-docs
  labels:
    {{- include "lucity.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lucity.selectorLabels" (dict "name" "docs" "release" .Release.Name) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.docs.port }}
          protocol: TCP
---
{{- if .Values.cashier.enabled }}
# Cashier: gRPC from conductor (namespace) + HTTP webhook from any source
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lucity.fullname" . }}-cashier
  labels:
    {{- include "lucity.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lucity.selectorLabels" (dict "name" "cashier" "release" .Release.Name) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # gRPC from within namespace (conductor)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.cashier.port }}
          protocol: TCP
    # Stripe webhook from any source
    - ports:
        - port: {{ .Values.cashier.webhookPort }}
          protocol: TCP
{{- end }}
