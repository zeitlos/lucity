# ServiceAccounts for components that do NOT need Kubernetes API access.
# automountServiceAccountToken is disabled to prevent unnecessary token mounting.
#
# The conductor SA (which DOES need K8s API access) is defined in
# conductor-rbac.yaml alongside its ClusterRole + RoleBinding.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lucity.fullname" . }}-dashboard
  labels:
    {{- include "lucity.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lucity.fullname" . }}-docs
  labels:
    {{- include "lucity.labels" . | nindent 4 }}
    app.kubernetes.io/component: docs
automountServiceAccountToken: false
