root = "."
tmp_dir = "../../tmp/air/conductor"
env_files = [".env"]

[build]
  bin = "../../tmp/air/conductor/conductor"
  cmd = "go build -o ../../tmp/air/conductor/conductor ./cmd/conductor/..."
  delay = 2500
  exclude_dir = ["node_modules", "tmp", "vendor"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go", "env"]
  include_dir = [".", "../../pkg", "../../charts"]
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[log]
  main_only = false
