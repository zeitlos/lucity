schema:
  - schema/*.graphqls

exec:
  filename: generated.go
  package: graphql

model:
  filename: model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: .
  package: graphql
  filename_template: "{name}.resolvers.go"

omit_slice_element_pointers: true
call_argument_directives_with_null: true

models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
  Time:
    model:
      - github.com/99designs/gqlgen/graphql.Time
  ProjectID:
    model: github.com/zeitlos/lucity/services/conductor/internal/conductor.ProjectID
  EnvironmentID:
    model: github.com/zeitlos/lucity/services/conductor/internal/conductor.EnvironmentID
  ServiceID:
    model: github.com/zeitlos/lucity/services/conductor/internal/conductor.ServiceID
  DeploymentID:
    model: github.com/zeitlos/lucity/services/conductor/internal/conductor.DeploymentID
  DatabaseID:
    model: github.com/zeitlos/lucity/services/conductor/internal/conductor.DatabaseID
  KeyValueStoreID:
    model: github.com/zeitlos/lucity/services/conductor/internal/conductor.KeyValueStoreID
  VolumeID:
    model: github.com/zeitlos/lucity/services/conductor/internal/conductor.VolumeID
  BuildID:
    model: github.com/zeitlos/lucity/services/conductor/internal/conductor.BuildID
  ReleaseID:
    model: github.com/zeitlos/lucity/services/conductor/internal/conductor.ReleaseID
