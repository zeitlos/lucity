overwrite: true
schema: "../conductor/internal/api/graphql/schema/*.graphqls"
documents:
  - "./src/**/*.vue"
  - "./src/**/*.ts"
generates:
  src/gql/:
    preset: "client"
    plugins: []
    config:
      useTypeImports: true
      enumType: native
      scalars:
        Time: string
        Duration: string
        ProjectID: string
        EnvironmentID: string
        ServiceID: string
        DeploymentID: string
        DatabaseID: string
        VolumeID: string
        BucketID: string
        BuildID: string
        DeployID: string
        KeyValueStoreID: string
        ReleaseID: string
        ScanID: string
        VariableID: string
    presetConfig:
      fragmentMasking: false
  ./graphql.schema.json:
    plugins:
      - "introspection"
